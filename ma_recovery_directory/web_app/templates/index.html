<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Massachusetts Recovery Services Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">Massachusetts Recovery Services Directory</h1>
                <p class="text-center text-muted">Find addiction recovery services across Massachusetts</p>
            </div>
        </div>

        <!-- Search Filters -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Search Filters</h5>
                    </div>
                    <div class="card-body">
                        <form id="searchForm">
                            <div class="row">
                                <div class="col-md-3">
                                    <label for="zipCode" class="form-label">ZIP Code</label>
                                    <input type="text" class="form-control" id="zipCode" placeholder="Enter ZIP code">
                                </div>
                                <div class="col-md-3">
                                    <label for="serviceType" class="form-label">Service Type</label>
                                    <select class="form-select" id="serviceType">
                                        <option value="">All Services</option>
                                        <option value="Inpatient">Inpatient Treatment</option>
                                        <option value="Outpatient">Outpatient Treatment</option>
                                        <option value="Detox">Detoxification</option>
                                        <option value="MAT">Medication-Assisted Treatment</option>
                                        <option value="Counseling">Counseling</option>
                                        <option value="Peer Support">Peer Support</option>
                                        <option value="Sober Living">Sober Living</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="language" class="form-label">Language</label>
                                    <select class="form-select" id="language">
                                        <option value="">All Languages</option>
                                        <option value="English">English</option>
                                        <option value="Spanish">Spanish</option>
                                        <option value="Portuguese">Portuguese</option>
                                        <option value="French">French</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="population" class="form-label">Population</label>
                                    <select class="form-select" id="population">
                                        <option value="">All Populations</option>
                                        <option value="Adults">Adults</option>
                                        <option value="Adolescents">Adolescents</option>
                                        <option value="Women">Women</option>
                                        <option value="Men">Men</option>
                                        <option value="LGBTQ+">LGBTQ+</option>
                                        <option value="Veterans">Veterans</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary me-2">Search</button>
                                    <button type="button" class="btn btn-secondary" id="clearBtn">Clear</button>
                                    <button type="button" class="btn btn-success ms-3" id="exportBtn" disabled>Export Results</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5>Search Results</h5>
                        <span id="resultCount" class="badge bg-secondary">0 results</span>
                    </div>
                    <div class="card-body">
                        <div id="results" class="row">
                            <!-- Results will be populated here -->
                        </div>
                        <div id="noResults" class="text-center text-muted" style="display: none;">
                            <p>No services found matching your criteria. Try adjusting your search filters.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Statistics -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Directory Statistics</h5>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-md-4">
                                <h3 id="totalServices" class="text-primary">0</h3>
                                <p>Total Services</p>
                            </div>
                            <div class="col-md-4">
                                <h3 id="citiesCovered" class="text-success">0</h3>
                                <p>Cities Covered</p>
                            </div>
                            <div class="col-md-4">
                                <h3 id="serviceTypes" class="text-info">0</h3>
                                <p>Service Types</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
